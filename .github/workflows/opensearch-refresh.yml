name: OpenSearch Refresh

on:
  workflow_dispatch:
    inputs:
      source_env:
        description: 'Source environment'
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
          - preprod
          - prod
      dest_env:
        description: 'Destination environment'
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
          - preprod
          - training

jobs:
  create_snapshot:
    name: "Create snapshot (${{ inputs.source_env }})"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.source_env }}
    outputs:
      SNAPSHOT_NAME: ${{ steps.get_snapshot_name.outputs.SNAPSHOT_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CERT }}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config use-context ${KUBE_CLUSTER}
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}

      - name: Uninstall Existing Chart
        run: |
          echo "Uninstalling existing refresh-db Helm chart..."
          helm uninstall create-opensearch-refresh-snapshot --ignore-not-found

      - name: Create snapshot
        run: |
            helm install create-opensearch-refresh-snapshot ./jobs/refresh-opensearch \
              --set jobType=create \
              --set sourceEnv=${{ inputs.source_env }} \
              --set destEnv=${{ inputs.dest_env }} \
              --set slackWebhookUrl=${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Wait for create job
        run: kubectl wait job/create-opensearch-snapshot --for=condition=complete --timeout=3h

      - name: Get snapshot name
        id: get_snapshot_name
        run: |
          POD_NAME=$(kubectl get pods --selector=job-name=create-opensearch-snapshot -o jsonpath="{.items[0].metadata.name}")
          SNAPSHOT_NAME=$(kubectl logs "$POD_NAME" | grep '^SNAPSHOT_NAME=' | tail -n 1 | cut -d= -f2-)
          echo "SNAPSHOT_NAME=${SNAPSHOT_NAME}" >> $GITHUB_OUTPUT

      - name: Cleanup
        if: always()
        run: helm uninstall create-opensearch-refresh-snapshot --ignore-not-found

  restore_snapshot:
    name: "Restore snapshot (${{ inputs.dest_env }})"
    needs: create_snapshot
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.dest_env }}-preapproved
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CERT }}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config use-context ${KUBE_CLUSTER}
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}

      - name: Uninstall Existing Chart
        run: |
          echo "Uninstalling existing refresh-db Helm chart..."
          helm uninstall restore-opensearch-refresh-snapshot --ignore-not-found

      - name: Restore snapshot
        run: |
            helm install restore-opensearch-refresh-snapshot ./jobs/refresh-opensearch \
            --set jobType=restore \
            --set sourceEnv=${{ inputs.source_env }} \
            --set destEnv=${{ inputs.dest_env }} \
            --set snapshotName=${{ needs.create_snapshot.outputs.SNAPSHOT_NAME }} \
            --set slackWebhookUrl=${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Wait for restore job
        run: kubectl wait job/restore-opensearch-snapshot --for=condition=complete --timeout=3h

      - name: Cleanup
        if: always()
        run: helm uninstall restore-opensearch-refresh-snapshot --ignore-not-found