{{- if eq .Values.jobType "restore" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: restore-opensearch-snapshot
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: "{{ $.Values.job.serviceAccountPrefix }}-{{ $.Values.destEnv }}"
      restartPolicy: Never
      containers:
        - name: restore-opensearch-snapshot
          image: {{ .Values.job.image }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OPENSEARCH_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.opensearch.endpointSecretName }}
                  key: {{ $.Values.opensearch.endpointSecretKey }}
            - name: SNAPSHOT_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.opensearch.endpointSecretName }}
                  key: {{ $.Values.opensearch.snapshotRoleArnKey }}
            - name: SNAPSHOT_NAME
              value: "{{ $.Values.snapshotName }}"
            - name: SNAPSHOT_REPOSITORY
              value: "{{ $.Values.opensearch.snapshotRepository }}"
            - name: REGION
              value: "{{ $.Values.s3.region }}"
            - name: SRC_ENV
              value: "{{ $.Values.sourceEnv }}"
            - name: DST_ENV
              value: "{{ $.Values.destEnv }}"
            - name: INDICES
              value: "{{ $.Values.opensearch.indices }}"
            - name: SOURCE_S3_BUCKET_NAME
              value: "{{ $.Values.sourceS3Bucket }}"
            - name: SLACK_WEBHOOK_URL
              value: "{{ $.Values.slackWebhookUrl }}"
        
          command:
            - /bin/bash
            - -c
            - |
              ERROR_LOG=/tmp/error.log
              LAST_COMMAND=""
              exec 2> >(tee -a "$ERROR_LOG" >&2)
              trap 'LAST_COMMAND=$BASH_COMMAND' DEBUG

              send_slack_notification() {
                STATUS=$1

                if [ "$STATUS" -eq 0 ]; then
                  JSON_PAYLOAD=$(jq -n --arg text "✅ *Opensearch Refresh* (${SRC_ENV} → ${DST_ENV}) *SUCCEEDED*" '{text: $text}')
                else
                  ERROR_MSG=$(tail -n 20 "$ERROR_LOG" 2>/dev/null | tr '\n' ' ')
                  ERROR_MSG=${ERROR_MSG:-"Unknown error"}
                  JSON_PAYLOAD=$(jq -n --arg text "❌ *Opensearch Refresh* (${SRC_ENV} → ${DST_ENV}) *FAILED*.
                  *Failing Command:* ${LAST_COMMAND}.
                  *Error:* ${ERROR_MSG}" '{text: $text}')
                fi

                curl -s -X POST -H "Content-Type: application/json" --data "$JSON_PAYLOAD" "$SLACK_WEBHOOK_URL" || true
              }
            
              echo "OPENSEARCH_ENDPOINT: ${OPENSEARCH_ENDPOINT}"
              echo "SOURCE_S3_BUCKET_NAME: ${SOURCE_S3_BUCKET_NAME}"
              echo "SNAPSHOT_ROLE_ARN: ${SNAPSHOT_ROLE_ARN}"
              echo "SNAPSHOT_NAME: ${SNAPSHOT_NAME}"
              echo "SNAPSHOT_REPOSITORY: ${SNAPSHOT_REPOSITORY}"
              echo "REGION: ${REGION}"
              echo "SOURCE_ENV: ${SRC_ENV}"
              echo "DEST_ENV: ${DST_ENV}"
              echo "INDICES: ${INDICES}"

              # Check if repository exists
              REPO_RESPONSE=$(curl -s "$OPENSEARCH_ENDPOINT/_snapshot/$SNAPSHOT_REPOSITORY")

              if echo "$REPO_RESPONSE" | grep -q "\"$SNAPSHOT_REPOSITORY\""; then
                echo "Repository already exists"
              else
                echo "Repository does not exist. Creating snapshot repository..."

                RESPONSE=$(curl -s -XPUT \
                  "$OPENSEARCH_ENDPOINT/_snapshot/$SNAPSHOT_REPOSITORY" \
                  -H 'Content-Type: application/json' \
                  -d "{
                    \"type\": \"s3\",
                    \"settings\": {
                      \"bucket\": \"$SOURCE_S3_BUCKET_NAME\",
                      \"region\": \"$REGION\",
                      \"role_arn\": \"$SNAPSHOT_ROLE_ARN\",
                      \"base_path\": \"refresh-snapshots\"
                    }
                  }")

                if echo "$RESPONSE" | grep -q '"acknowledged":true'; then
                  echo "Repository created successfully"
                else
                  echo "Failed to create repository: $RESPONSE"
                  exit 1
                fi
              fi

              # Delete indices before restore if they exist
              echo "Checking and deleting existing indices..."
              for INDEX in $(echo "$INDICES" | tr ',' ' '); do
                INDEX_CHECK=$(curl -s -o /dev/null -w "%{http_code}" "$OPENSEARCH_ENDPOINT/$INDEX")

                if [ "$INDEX_CHECK" = "200" ]; then
                  echo "Deleting index $INDEX..."
                  curl -XDELETE "$OPENSEARCH_ENDPOINT/$INDEX"
                fi
              done

              # Restore snapshot
              echo "Restoring snapshot..."
              RESPONSE=$(curl -XPOST "$OPENSEARCH_ENDPOINT/_snapshot/$SNAPSHOT_REPOSITORY/$SNAPSHOT_NAME/_restore" -H 'Content-Type: application/json' -d "{
                \"indices\": \"$INDICES\",
                \"include_global_state\": false
              }")

              echo "Restore Command: $RESPONSE"

              if ! echo "$RESPONSE" | grep -q '"accepted":true'; then
                echo "Failed to initiate restore: $RESPONSE"
                send_slack_notification 1
                exit 1
              fi

              # Monitor restore progress
              echo "Monitoring restore progress..."
              while true; do
                CURRENT_TIME=$(date "+%Y-%m-%d %H:%M:%S")

                # Check recovery status
                RECOVERY_STATUS=$(curl -s "$OPENSEARCH_ENDPOINT/_recovery" | grep -o '"stage":"[^"]*"' | sort -u)

                if echo "$RECOVERY_STATUS" | grep -q "DONE"; then
                  echo "[$CURRENT_TIME] Restore completed successfully"
                  break
                elif echo "$RECOVERY_STATUS" | grep -q "FAILED"; then
                  echo "[$CURRENT_TIME] Restore failed"
                  send_slack_notification 1
                  exit 1
                else
                  echo "[$CURRENT_TIME] Restore in progress... (Status: $RECOVERY_STATUS)"
                  sleep 10
                fi
              done

              # Open restored indices
              echo "Opening restored indices..."
              for INDEX in $(echo "$INDICES" | tr ',' ' '); do
                echo "Opening index $INDEX..."
                curl -XPOST "$OPENSEARCH_ENDPOINT/$INDEX/_open"
                send_slack_notification 0
              done

  {{- end }}
