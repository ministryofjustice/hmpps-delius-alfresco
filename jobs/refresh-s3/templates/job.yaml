---
apiVersion: v1
kind: ConfigMap
metadata:
  name: refresh-s3-script
data:
  entrypoint.sh: |-
    #!/bin/bash
    set -xe

    ERROR_LOG=/tmp/error.log
    LAST_COMMAND=""
    exec 2> >(tee -a "$ERROR_LOG" >&2)
    trap 'LAST_COMMAND=$BASH_COMMAND' DEBUG
    
    send_slack_notification() {
      STATUS=$1

      if [ "$STATUS" -eq 0 ]; then
        JSON_PAYLOAD=$(jq -n --arg text "✅ *S3 Refresh* (${SRC_ENV} → ${DST_ENV}) *SUCCEEDED*
        *Directory:* ${DIR}"
        '{text: $text}')
      else
        ERROR_MSG=$(tail -n 20 "$ERROR_LOG" 2>/dev/null | tr '\n' ' ')
        ERROR_MSG=${ERROR_MSG:-"Unknown error"}
        JSON_PAYLOAD=$(jq -n --arg text "❌ *S3 Refresh* (${SRC_ENV} → ${DST_ENV}) *FAILED*.
        *Directory:* ${DIR}
        *Failing Command:* ${LAST_COMMAND}
        *Error:* ${ERROR_MSG}" '{text: $text}')
      fi

      curl -s -X POST -H "Content-Type: application/json" --data "$JSON_PAYLOAD" "$SLACK_WEBHOOK_URL" || true
    }

    trap 'send_slack_notification $?' EXIT

    aws configure set default.s3.max_concurrent_requests 2000

    aws s3 sync s3://$SRC_BUCKET/$DIR s3://$DST_BUCKET/$DIR --delete --only-show-errors --region eu-west-2

    set +x
    echo sync of $DIR directory completed

{{- range .Values.directories }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: refresh-s3-{{ . | toString | replace "/" "-" }}
  labels:
    name-prefix: refresh-s3
spec:
  template:
    spec:
      containers:
      - name: refresh-s3
        image: 754256621582.dkr.ecr.eu-west-2.amazonaws.com/webops/cloud-platform-service-pod:c5f69b4624b956248001fa7c173c89a0556a457e
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 4
            memory: 8Gi
        command:
        - /bin/entrypoint.sh
        env:
        - name: SRC_ENV
          value: "{{ $.Values.sourceEnvironment }}"
        - name: DST_ENV
          value: "{{ $.Values.destinationEnvironment }}"
        - name: SRC_BUCKET
          valueFrom:
            secretKeyRef:
              name: s3-bucket-output
              key: BUCKET_NAME
        - name: DST_BUCKET
          valueFrom:
            secretKeyRef:
              name: s3-bucket-output-{{ $.Values.destinationEnvironment }}
              key: BUCKET_NAME
        - name: DIR
          value: {{ . | quote }}
        volumeMounts:
        - name: refresh-s3-script
          mountPath: /bin/entrypoint.sh
          readOnly: true
          subPath: entrypoint.sh
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      serviceAccount: hmpps-migration-{{ $.Values.sourceEnvironment }}
      serviceAccountName: hmpps-migration-{{ $.Values.sourceEnvironment }}
      restartPolicy: OnFailure
      volumes:
      - name: refresh-s3-script
        configMap:
          name: refresh-s3-script
          defaultMode: 0755
  backoffLimit: 10
{{- end }}
...
