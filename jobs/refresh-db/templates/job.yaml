---
apiVersion: v1
kind: ConfigMap
metadata:
  name: refresh-db-script
data:
  entrypoint.sh: |-
    #!/bin/bash
    set -e

    ERROR_LOG=/tmp/error.log
    exec 2> >(tee -a "$ERROR_LOG" >&2)
    trap 'echo "FAILED COMMAND: $BASH_COMMAND"' ERR
    LAST_COMMAND=""
    trap 'LAST_COMMAND=$BASH_COMMAND' DEBUG

    send_slack_notification() {
      STATUS=$1

      if [ "$STATUS" -eq 0 ]; then
        JSON_PAYLOAD=$(jq -n --arg text "✅ Alfresco RDS Refresh (${SRC_ENV} → ${DST_ENV}) SUCCEEDED" '{text: $text}')
      else
        ERROR_MSG=$(tail -n 20 ~/error.log 2>/dev/null | tr '\n' ' ')
        ERROR_MSG=${ERROR_MSG:-"Unknown error"}
        JSON_PAYLOAD=$(jq -n --arg text "❌ Alfresco RDS Refresh (${SRC_ENV} → ${DST_ENV}) FAILED. *Failing Command:* ${LAST_COMMAND}.
        *Error:* ${ERROR_MSG}" '{text: $text}')
      fi

      curl -s -X POST -H "Content-Type: application/json" --data "$JSON_PAYLOAD" "$SLACK_WEBHOOK_URL" || true
    }

    trap 'send_slack_notification $?' EXIT

    # Guard against SRC_ENV = DST_ENV
    if [[ "$SRC_ENV" == "$DST_ENV" ]]; then
      echo "ERROR: Source and Destination environments are the same ($SRC_ENV). Aborting!" >&2
      exit 1
    fi

    echo "${SRC_DB_HOST}:5432:${SRC_DB_NAME}:${SRC_DB_USER}:${SRC_DB_PASS}" > ~/.pgpass
    echo "${DST_DB_HOST}:5432:${DST_DB_NAME}:${DST_DB_USER}:${DST_DB_PASS}" >> ~/.pgpass
    chmod 0600 ~/.pgpass
    chown job:job ~/.pgpass
    
    # connectivity checks
    echo "Testing source DB connectivity..."
    PGPASSWORD="$SRC_DB_PASS" psql -h "$SRC_DB_HOST" -U "$SRC_DB_USER" -d "$SRC_DB_NAME" -c "SELECT 1;"

    echo "Testing destination DB connectivity..."
    PGPASSWORD="$DST_DB_PASS" psql -h "$DST_DB_HOST" -U "$DST_DB_USER" -d "$DST_DB_NAME" -c "SELECT 1;"

    # Dry-run mode
    if [[ "$DRY_RUN" == "true" ]]; then
      echo "Dry-run mode enabled. Performing pg_dump test only..."
      pg_dump --host="$SRC_DB_HOST" --username="$SRC_DB_USER" --dbname="$SRC_DB_NAME" --schema-only --file=/dev/null
      echo "Dry-run test completed successfully. Exiting."
      exit 0
    fi

    # ----------------------
    # Actual refresh process
    # ----------------------
    set -x
    echo "Starting Database Refresh now....."
    # Dump the source database
    pg_dump --jobs=4 --host="$SRC_DB_HOST" --username="$SRC_DB_USER" --dbname="$SRC_DB_NAME" --no-owner --no-privileges --verbose --format=directory --file=/home/job/db-dump

    psql --host="$DST_DB_HOST" --username="$DST_DB_USER" --dbname="$DST_DB_NAME" -c "drop schema if exists public cascade;"

    psql --host="$DST_DB_HOST" --username="$DST_DB_USER" --dbname="$DST_DB_NAME" -c "create schema public;"

    # Restore the source database dump to the destination database
    pg_restore --jobs=4 --host="$DST_DB_HOST" --username="$DST_DB_USER" --dbname="$DST_DB_NAME" --no-owner --no-privileges --verbose /home/job/db-dump
    rm -rv /home/job/db-dump ~/.pgpass

    echo "Restoring destination OpenSearch URL..."
    OPENSEARCH_HOST=$(echo "$OPENSEARCH_PROXY_URL" | sed -E 's#https?://##; s#:[0-9]+$##')
    psql --host="$DST_DB_HOST" --username="$DST_DB_USER" --dbname="$DST_DB_NAME" -c "
          UPDATE alf_prop_string_value
          SET string_value = '${OPENSEARCH_HOST}'
          WHERE string_value LIKE 'opensearch-proxy-service-cloud-platform%';
        "

    echo "OpenSearch URL restored."

---
{{- if eq .Values.sourceEnvironment .Values.destinationEnvironment }}
{{ fail "Source and destination environments cannot be the same." }}
{{- end }}
{{- if eq .Values.destinationEnvironment "prod" }}
{{ fail "Destination environment cannot be Prod. Refreshing into prod is not allowed!" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: refresh-db
  labels:
    name-prefix: refresh-db
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: refresh-db
        image: ghcr.io/ministryofjustice/hmpps-delius-alfresco-db-utils:latest
        imagePullPolicy: IfNotPresent
        terminationMessagePolicy: FallbackToLogsOnError
        resources:
          limits:
            cpu: 4
            memory: 4Gi
        command:
        - /bin/entrypoint.sh
        env:
        - name: HOME
          value: "/home/job"
        - name: DRY_RUN
          value: "{{ .Values.dryRun }}"
        - name: SRC_DB_NAME
          valueFrom:
            secretKeyRef:
              name: rds-instance-output-from-{{ .Values.sourceEnvironment }}
              key: DATABASE_NAME
        - name: SRC_DB_USER
          valueFrom:
            secretKeyRef:
              name: rds-instance-output-from-{{ .Values.sourceEnvironment }}
              key: DATABASE_USERNAME
        - name: SRC_DB_PASS
          valueFrom:
            secretKeyRef:
              name: rds-instance-output-from-{{ .Values.sourceEnvironment }}
              key: DATABASE_PASSWORD
        - name: SRC_DB_HOST
          valueFrom:
            secretKeyRef:
              name: rds-instance-output-from-{{ .Values.sourceEnvironment }}
              key: RDS_INSTANCE_ADDRESS
        - name: DST_DB_NAME
          valueFrom:
            secretKeyRef:
              name: rds-instance-output
              key: DATABASE_NAME
        - name: DST_DB_USER
          valueFrom:
            secretKeyRef:
              name: rds-instance-output
              key: DATABASE_USERNAME
        - name: DST_DB_PASS
          valueFrom:
            secretKeyRef:
              name: rds-instance-output
              key: DATABASE_PASSWORD
        - name: DST_DB_HOST
          valueFrom:
            secretKeyRef:
              name: rds-instance-output
              key: RDS_INSTANCE_ADDRESS
        - name: SLACK_WEBHOOK_URL
          value: "{{ .Values.slackWebhookUrl }}"
        - name: OPENSEARCH_PROXY_URL
          valueFrom:
            secretKeyRef:
              name: opensearch-output
              key: PROXY_URL
        - name: SRC_ENV
          value: "{{ .Values.sourceEnvironment }}"
        - name: DST_ENV
          value: "{{ .Values.destinationEnvironment }}"
        volumeMounts:
        - name: refresh-db-script
          mountPath: /bin/entrypoint.sh
          readOnly: true
          subPath: entrypoint.sh
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      serviceAccount: hmpps-migration-{{ .Values.destinationEnvironment }}
      serviceAccountName: hmpps-migration-{{ .Values.destinationEnvironment }}
      restartPolicy: Never
      volumes:
      - name: refresh-db-script
        configMap:
          name: refresh-db-script
          defaultMode: 0755
...
